name: basic-pr-checks
on:
  pull_request_target:
permissions:
  contents: read
concurrency:
  group: basic-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  basic-pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base scanner without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch and verify free Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Fetch PR objects without checking out or executing PR code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git -c core.hooksPath=/dev/null -C trusted fetch --no-tags --no-recurse-submodules \
            --no-write-fetch-head --no-auto-maintenance origin "refs/pull/$PR_NUMBER/head"
          git -C trusted cat-file -e "$PR_HEAD^{commit}"
      - name: Verify real scanner with synthetic negative fixtures
        env:
          GK_GITLEAKS: ${{ runner.temp }}/gitleaks
          GK_FIXTURE_ROOT: ${{ runner.temp }}
        run: node --test trusted/.github/scripts/scan-pr.test.mjs
      - name: Scan exact PR diffs with observed per-commit boundaries
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GK_GITLEAKS: ${{ runner.temp }}/gitleaks
        shell: bash
        run: |
          set -euo pipefail
          node trusted/.github/scripts/scan-pr.mjs "$GITHUB_WORKSPACE/trusted" "$PR_BASE" "$PR_HEAD" "$GK_GITLEAKS"
